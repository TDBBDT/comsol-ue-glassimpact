[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "glass-impact-tools"
version = "0.1.0"
description = "Validated COMSOL surface fields to Unreal Engine fixed-topology glass playback"
requires-python = ">=3.9"
dependencies = ["numpy>=1.23,<3", "matplotlib>=3.6,<4", "Pillow>=9,<12"]

[project.optional-dependencies]
vtk = ["meshio>=5.3,<6"]
yaml = ["PyYAML>=6,<7"]

[tool.setuptools.packages.find]
where = ["tools"]
